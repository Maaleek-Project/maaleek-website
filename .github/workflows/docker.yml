name: Build et déploiement

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/maaleek-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Préparer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Déployer sur Kubernetes
        run: ssh deployer@${{ vars.VPS_HOST }} "frontend maaleek-web ${{ env.IMAGE }}:${{ github.sha }}"
